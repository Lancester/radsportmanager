name: R24 Erster Gruppenriss Diagnose

on:
  pull_request:
    branches: [develop/manager-mvp]
    paths:
      - 'src/engine/race/race-simulator.ts'
      - 'scripts/r24-first-gap-trace.mjs'
      - '.github/workflows/r24-first-gap-trace.yml'

permissions:
  contents: read

jobs:
  first-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript-Pruefung
        run: npm run typecheck --if-present
      - name: Kontrolliertes Rennen ohne Attacken und Langzeitermuedung
        run: node --experimental-strip-types scripts/r24-first-gap-trace.mjs 2026 | tee first-gap-trace.jsonl
      - name: Diagnosebericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-first-gap-diagnose
          path: first-gap-trace.jsonl
          retention-days: 7
          if-no-files-found: ignore
