name: R-11 – sieben korrigierte Vollrennen (einmalig)

on:
  push:
    branches:
      - fix/r11-sieben-eindeutige-diagnoserennen

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
      - name: Node.js 22 installieren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exakt sieben Rennläufe ausführen
        run: |
          node --experimental-strip-types scripts/r11-balance-diagnostics.mjs | tee r11-resultate.txt
          test "$(grep -c '^R11-LAUF ' r11-resultate.txt)" -eq 7
          test "$(grep -c '^R11-TAKTIKVERGLEICH ' r11-resultate.txt)" -eq 2
          test "$(grep -c '^R11-PROFILVERGLEICH ' r11-resultate.txt)" -eq 1
      - name: Diagnoseartefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: r11-sieben-eindeutige-rennen
          path: r11-resultate.txt
          retention-days: 14
