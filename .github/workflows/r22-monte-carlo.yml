name: R-22 – Monte-Carlo-Test manuell starten

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Rennprofil (einzelnes Rennen)'
        type: choice
        options: [flach, huegelig, klassiker, berg]
        required: true
        default: flach
      runs:
        description: 'Anzahl Seeds (bei Verpflegungsvergleich je 2 Rennen)'
        type: choice
        options: ['3', '10', '25', '50', '100']
        required: true
        default: '3'
      teams:
        description: 'Anzahl Mannschaften'
        type: choice
        options: ['5', '10', '22']
        required: true
        default: '10'
      distance:
        description: 'Strecke in km'
        type: choice
        options: ['50', '60', '170', '200', '240']
        required: true
        default: '60'
      comparison:
        description: 'Gleiches Feld und Seeds gepaart mit 20 und 100 g/h vergleichen?'
        type: choice
        options: [none, carbs]
        required: true
        default: none
      seed:
        description: 'Erster Seed (ganze Zahl zwischen 0 und 2147483547)'
        type: string
        required: true
        default: '2026'

permissions:
  contents: read
jobs:
  monte-carlo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduzierbare Monte-Carlo-Serie ohne Kalibrierungsboni
        env:
          R_PROFILE: ${{ inputs.profile }}
          R_RUNS: ${{ inputs.runs }}
          R_TEAMS: ${{ inputs.teams }}
          R_DISTANCE: ${{ inputs.distance }}
          R_COMPARISON: ${{ inputs.comparison }}
          R_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/r22-monte-carlo.mjs \
            --profile "$R_PROFILE" --runs "$R_RUNS" \
            --teams "$R_TEAMS" --roster 7 \
            --distance "$R_DISTANCE" --comparison "$R_COMPARISON" \
            --seed "$R_SEED" --output artifacts/r22
          cat artifacts/r22/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-monte-carlo-results
          path: artifacts/r22/
          retention-days: 30
          if-no-files-found: warn
