name: R-17-R-21 – einmalige Langstrecken-/Skalierungsabnahme
on:
  push:
    branches: [feature/r17-r21-engine-abschluss]
permissions:
  contents: read
jobs:
  r21-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typprüfung und Browser-Build
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          npm run build:benchmark
      - name: Großfeld und Langdistanz physisch simulieren
        run: |
          node --experimental-strip-types scripts/r21-scale-diagnostics.mjs | tee r21-results.txt
          test "$(grep -c '^R21-SCALE ' r21-results.txt)" -eq 5
      - name: Browser-ESM-Rennen
        run: |
          node --input-type=module <<'NODE'
          import {createRaceExample,simulateRace} from './docs/benchmark/generated/race/race-simulator.js';
          const x=createRaceExample({profile:'flach',seed:2027});
          x.segments[0].crosswindMps=4;
          const result=simulateRace(x);
          if(result.finisherCount!==30||result.diagnostics.participants!==30||
            result.classification.some(r=>r.finalWPrimeJ<0||
              Math.abs(r.energyResidualJ)>0.05))
            throw new Error('R-17–R-21: ESM-Renntest ungültig');
          console.log('R21-BROWSER',JSON.stringify({
            riders:result.finisherCount,relays:result.diagnostics.relayChanges,
            endurancePenalty:result.diagnostics.maximumEndurancePenalty
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: r21-langen-rennen-skalierung
          path: r21-results.txt
          retention-days: 14
