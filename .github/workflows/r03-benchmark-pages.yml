name: Android R-03 Benchmark (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/physics/**'
      - 'tests/**'
      - 'docs/index.html'
      - 'docs/benchmark/**'
      - 'package.json'
      - '.github/workflows/r03-benchmark-pages.yml'
  workflow_dispatch:

concurrency:
  group: r03-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript Compiler einmalig installieren
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Alle Physiktests ausführen
        run: npm test
      - name: Exakt vorhandene R-03-Engine für Browser übersetzen
        run: npm run build:benchmark
      - name: Erzeugtes Browsermodul mit Node ESM smoke-testen
        run: |
          node --input-type=module <<'NODE'
          const m = await import('./docs/benchmark/generated/physics/drafting-pair.js');
          const result = m.simulateTwoRiders(m.R03_PAIR_EXAMPLE);
          const expected = m.R03_PAIR_EXAMPLE.durationS;
          const timeDifference = Math.abs(result.elapsedS - expected);
          console.log('Simulationszeit:', result.elapsedS, 's, Soll:', expected, 's');
          console.log('Schritte:', result.steps, 'Endpositionen:',
            result.riders.map(rider => rider.positionM));
          // Gleitkommaarithmetik darf minimale Rundungsfehler haben.
          if (!Number.isFinite(result.elapsedS) || timeDifference > 1e-9 ||
              result.steps < 1 || result.riders.some(rider => !Number.isFinite(rider.positionM))) {
            throw new Error('Browsermodul liefert keine gueltigen physikalischen Ergebnisse');
          }
          console.log('Browsermodul importierbar und Simulation plausibel');
          const group = await import('./docs/benchmark/generated/physics/drafting-group.js');
          const eight = group.simulateGroup(group.createEightRiderExample(120));
          if (!Number.isFinite(eight.elapsedS) || Math.abs(eight.elapsedS-120)>1e-9 ||
              eight.riders.length !== 8 || eight.events.every(e=>e.type!=='gap-opened') ||
              eight.riders.some(r=>!Number.isFinite(r.energyResidualJ))) {
            throw new Error('Achtfahrer-Gruppe liefert keine plausiblen Browserergebnisse');
          }
          console.log('Achtfahrer-Gruppenmodul erfolgreich, Schritte:',eight.steps);
          const withAgent = group.simulateGroup(group.createEightRiderAgentExample(120));
          const agentEvents = withAgent.events.filter(e => e.type === 'agent-decision');
          const oldGap = eight.riders[6].positionM - eight.riders[7].positionM;
          const newGap = withAgent.riders[6].positionM - withAgent.riders[7].positionM;
          console.log('Lücke ohne Agent:',oldGap,'mit Agent:',newGap,'Agentenaktionen:',agentEvents.length);
          if (agentEvents.length === 0 || newGap >= oldGap ||
              withAgent.riders.some(r => !Number.isFinite(r.energyResidualJ))) {
            throw new Error('Regelagent erzielt keine nachvollziehbare Änderung');
          }
          console.log('Regelagent kontrolliert den Wattwunsch erfolgreich');
          const safe = group.simulateGroup(group.createEightRiderR05Example(120));
          const last = safe.riders[7];
          console.log('R05: Endlücke',safe.riders[6].positionM-last.positionM,
            'Wprime Rest',last.wPrimeRemainingJ,'CP-Limit Sekunden',last.cpLimitedSeconds,
            'Bremszeit',safe.riders.reduce((x,r)=>x+r.safetyBrakeSeconds,0));
          if(Math.abs(safe.elapsedS-120)>1e-9 || safe.riders.length!==8 ||
            last.wPrimeRemainingJ < 0 || last.wPrimeRemainingJ > 1200 ||
            !safe.events.some(e=>e.type==='agent-decision') ||
            safe.riders.some(r=>!Number.isFinite(r.energyResidualJ))) {
            throw new Error('R05 CP/Wprime + Sicherheitskontrolle fehlerhaft');
          }
          NODE
      - name: Git-Commit des Teststands für Bericht notieren
        run: git rev-parse --short HEAD > docs/benchmark/version.txt
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Statische Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Webseite veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
