name: Radsportmanager – Rennen und Physiktests (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/engine/physics/**'
      - 'src/engine/ai/**'
      - 'src/engine/physiology/**'
      - 'src/engine/race/**'
      - 'tests/**'
      - 'docs/index.html'
      - 'docs/rennen.html'
      - 'docs/race/**'
      - 'docs/benchmark/**'
      - 'package.json'
      - '.github/workflows/r03-benchmark-pages.yml'
  workflow_dispatch:

concurrency:
  group: r03-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript Compiler einmalig installieren
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: Alle Physiktests ausführen
        run: npm test
      - name: Exakt vorhandene R-03-Engine für Browser übersetzen
        run: npm run build:benchmark
      - name: Erzeugtes Browsermodul mit Node ESM smoke-testen
        run: |
          node --input-type=module <<'NODE'
          const m = await import('./docs/benchmark/generated/physics/drafting-pair.js');
          const result = m.simulateTwoRiders(m.R03_PAIR_EXAMPLE);
          const expected = m.R03_PAIR_EXAMPLE.durationS;
          const timeDifference = Math.abs(result.elapsedS - expected);
          console.log('Simulationszeit:', result.elapsedS, 's, Soll:', expected, 's');
          console.log('Schritte:', result.steps, 'Endpositionen:',
            result.riders.map(rider => rider.positionM));
          // Gleitkommaarithmetik darf minimale Rundungsfehler haben.
          if (!Number.isFinite(result.elapsedS) || timeDifference > 1e-9 ||
              result.steps < 1 || result.riders.some(rider => !Number.isFinite(rider.positionM))) {
            throw new Error('Browsermodul liefert keine gueltigen physikalischen Ergebnisse');
          }
          console.log('Browsermodul importierbar und Simulation plausibel');
          const group = await import('./docs/benchmark/generated/physics/drafting-group.js');
          const eight = group.simulateGroup(group.createEightRiderExample(120));
          if (!Number.isFinite(eight.elapsedS) || Math.abs(eight.elapsedS-120)>1e-9 ||
              eight.riders.length !== 8 || eight.events.every(e=>e.type!=='gap-opened') ||
              eight.riders.some(r=>!Number.isFinite(r.energyResidualJ))) {
            throw new Error('Achtfahrer-Gruppe liefert keine plausiblen Browserergebnisse');
          }
          console.log('Achtfahrer-Gruppenmodul erfolgreich, Schritte:',eight.steps);
          const withAgent = group.simulateGroup(group.createEightRiderAgentExample(120));
          const agentEvents = withAgent.events.filter(e => e.type === 'agent-decision');
          const oldGap = eight.riders[6].positionM - eight.riders[7].positionM;
          const newGap = withAgent.riders[6].positionM - withAgent.riders[7].positionM;
          console.log('Lücke ohne Agent:',oldGap,'mit Agent:',newGap,'Agentenaktionen:',agentEvents.length);
          if (agentEvents.length === 0 || newGap >= oldGap ||
              withAgent.riders.some(r => !Number.isFinite(r.energyResidualJ))) {
            throw new Error('Regelagent erzielt keine nachvollziehbare Änderung');
          }
          console.log('Regelagent kontrolliert den Wattwunsch erfolgreich');
          const safe = group.simulateGroup(group.createEightRiderR05Example(120));
          const last = safe.riders[7];
          console.log('R05: Endlücke',safe.riders[6].positionM-last.positionM,
            'Wprime Rest',last.wPrimeRemainingJ,'CP-Limit Sekunden',last.cpLimitedSeconds,
            'Bremszeit',safe.riders.reduce((x,r)=>x+r.safetyBrakeSeconds,0));
          if(Math.abs(safe.elapsedS-120)>1e-9 || safe.riders.length!==8 ||
            last.wPrimeRemainingJ < 0 || last.wPrimeRemainingJ > 1200 ||
            !safe.events.some(e=>e.type==='agent-decision') ||
            safe.riders.some(r=>!Number.isFinite(r.energyResidualJ))) {
            throw new Error('R05 CP/Wprime + Sicherheitskontrolle fehlerhaft');
          }
          const passing=group.simulateGroup(group.createEightRiderPassExample(65));
          const passingEvents=passing.events.filter(e=>e.type==='overtake');
          console.log('R06 physische Überholvorgänge:',passingEvents.length,
            'F8 Spur:',passing.riders[7].lateralPositionM,
            'F8 FTP-Zeit im R05-Modus:',last.timeAboveFtpS);
          if(Math.abs(passing.elapsedS-65)>1e-9 ||
            !passingEvents.some(e=>e.riderId==='F8'&&e.passedRiderId==='F7') ||
            Math.abs(passing.riders[7].lateralPositionM-2)>1e-8 ||
            !Number.isFinite(last.timeAboveFtpS)||last.timeAboveFtpS<=0){
            throw new Error('R06 Spurdynamik oder FTP-Statistik ungültig');
          }
          const auto=group.simulateGroup(group.createEightRiderAutoPassExample(65));
          const timed=group.simulateGroup(group.createEightRiderTimedPassWithCpExample(65));
          const laneEvents=auto.events.filter(e=>e.type==='agent-lane-choice');
          const autoPasses=auto.events.filter(e=>e.type==='overtake'&&e.riderId==='F8');
          const deltaM=Math.abs(auto.riders[7].positionM-timed.riders[7].positionM);
          console.log('R07 autonom: Spurentscheidungen',laneEvents.length,
            'Überholungen',autoPasses.length,'Wprime Rest',auto.riders[7].wPrimeRemainingJ,
            'Abweichung zum manuell identischen Physiklauf:',deltaM);
          if(Math.abs(auto.elapsedS-65)>1e-9||laneEvents.length!==1||
            autoPasses.length<1||deltaM>1e-5||
            Math.abs(auto.riders[7].lateralPositionM-2)>1e-8||
            auto.riders[7].wPrimeRemainingJ<0||
            auto.riders.some(r=>!Number.isFinite(r.energyResidualJ))) {
            throw new Error('R07 autonome Spurwahl, CP-Reserve oder Physikvergleich ungültig');
          }
          const returning=group.simulateGroup(group.createEightRiderRejoinExample(115));
          const rejoinEvents=returning.events.filter(e=>e.type==='agent-rejoin-choice');
          console.log('R08 Rejoin: Entscheidungen',rejoinEvents.length,
            'Abgeschlossene Rückkehr',returning.riders[7].autonomousRejoins,
            'Überholvorgänge',returning.riders[7].autonomousOvertakes,
            'F8 y',returning.riders[7].lateralPositionM);
          if(returning.riders[7].autonomousRejoins!==1 ||
            returning.riders[7].autonomousOvertakes<7 ||
            Math.abs(returning.riders[7].lateralPositionM)>1e-7)
            throw new Error('R08 Wiedereinscheren nicht abgeschlossen');
          const multi=group.simulateGroup(group.createEightRiderMultiAgentExample(70));
          const choices=multi.events.filter(e=>e.type==='agent-lane-choice');
          const race = await import('./docs/benchmark/generated/race/race-simulator.js');
          const firstRace=race.simulateRace(race.createRaceExample());
          const attackRace=race.simulateRace(race.createRaceExample({
            homeStrategy:'offensiv',
          }));
          console.log('R09 50km-Rennen:',firstRace.classification.length,'Fahrer,',
            firstRace.durationS.toFixed(1),'s, Sieger',firstRace.winnerId,
            'Attacken',firstRace.diagnostics.attacks,
            'Taktikvergleich:',firstRace.classification.find(x=>x.id==='F01').finishTimeS,
            attackRace.classification.find(x=>x.id==='F01').finishTimeS);
          if(firstRace.distanceM!==50000 || firstRace.finisherCount!==30 ||
             firstRace.classification.length!==30 ||
             !firstRace.classification.every(r=>r.finishTimeS>0&&r.gapS>=0&&
               Number.isFinite(r.averageCrankPowerW)) ||
             !firstRace.events.some(e=>e.type==='sprint') ||
             !attackRace.events.some(e=>e.type==='attack'&&e.teamId==='T1') ||
             Math.abs(firstRace.classification.find(x=>x.id==='F01').finishTimeS-
                attackRace.classification.find(x=>x.id==='F01').finishTimeS)<0.1) {
            throw new Error('R09: vollständiges Rennen oder Taktikvergleich gescheitert');
          }
          console.log('R08 Multi-Agent:',choices.map(e=>e.riderId+':'+e.lateralPositionM),
            'Überholvorgänge',multi.events.filter(e=>e.type==='overtake').length,
            'Querdynamik',multi.riders.map(r=>r.maximumSteeringAccelerationMps2??0));
          if(choices.length<2||choices.find(e=>e.riderId==='F7')?.lateralPositionM!==2||
            choices.find(e=>e.riderId==='F8')?.lateralPositionM!==-2||
            multi.riders.some(r=>!Number.isFinite(r.energyResidualJ))||
            multi.riders.some(r=>(r.maximumSteeringAccelerationMps2??0)>1.500001))
            throw new Error('R08 koordinierte Spurwahl oder Querdynamik ungültig');
          NODE
      - name: Git-Commit des Teststands für Bericht notieren
        run: git rev-parse --short HEAD > docs/benchmark/version.txt
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Statische Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Webseite veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
