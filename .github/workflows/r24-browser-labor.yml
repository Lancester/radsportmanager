name: Rennlabor – Browser-Build und echte Engine-Tests
on:
  pull_request:
    branches: [release/race-engine-1.0-rc1]
    paths:
      - 'src/labor/**'
      - 'docs/labor/**'
      - 'tests/r24-lab-settings.test.mjs'
      - 'tests/r24-lab-integration.test.mjs'
      - 'scripts/r24-lab-mobile-smoke.mjs'
      - '.github/workflows/r24-browser-labor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reine Konfigurations- und Ergebniszeit-Tests
        run: |
          node --experimental-strip-types --test tests/r24-lab-settings.test.mjs tests/r24-finish-time-groups.test.mjs tests/r24-lab-integration.test.mjs
      - name: Browser-JS (alle abhängigen originalen Engine-Module)
        run: |
          npx --yes --package typescript@5.9.3 tsc \
            --target ES2022 --module ES2022 --moduleResolution Bundler \
            --rewriteRelativeImportExtensions true --skipLibCheck \
            --rootDir src --outDir docs/labor/generated \
            src/labor/lab-settings.ts \
            src/engine/race/race-simulator.ts \
            src/engine/race/finish-time-groups.ts
      - name: Syntax und Browserpaket überprüfen
        run: |
          node --check docs/labor/app.js
          node --check docs/labor/worker.js
          test -s docs/labor/generated/labor/lab-settings.js
          test -s docs/labor/generated/engine/race/race-simulator.js
          test -s docs/labor/generated/engine/race/finish-time-groups.js
          test -s docs/labor/generated/engine/race/reference-fixtures.js
          node --input-type=module -e "import('./docs/labor/generated/labor/lab-settings.js').then(m => {const x=m.buildLabRace(m.initialLabSettings());if(x.input.riders.length!==154)process.exit(1);console.log('Browser ESM geladen:',x.input.riders.length)})"
      - name: Auslieferbares Paket mit eindeutiger ZIP-Struktur erstellen
        run: |
          cd docs/labor
          zip -qr ../../rennlabor-android-rc1.zip index.html app.js worker.js generated README.md
          cd ../..
          unzip -t rennlabor-android-rc1.zip | tail -2
      - name: HTML/Worker im mobilen Chromium wirklich starten
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/r24-lab-mobile-smoke.mjs
      - name: Sichtprüfung im Mobilformat sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rennlabor-android-screenshot
          path: rennlabor-mobile-smoke.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Fertiges Upload-ZIP exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rennlabor-android-upload-zip
          path: rennlabor-android-rc1.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Browserpaket exportieren
        uses: actions/upload-artifact@v4
        with:
          name: rennlabor-browser-rc1
          path: docs/labor/
          retention-days: 14
