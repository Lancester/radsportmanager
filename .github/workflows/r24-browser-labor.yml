name: Rennlabor – Browser-Build und echte Engine-Tests
on:
  pull_request:
    branches: [release/race-engine-1.0-rc1, develop/renn-labor-mvp-20261106]
    paths:
      - 'src/labor/**'
      - 'docs/labor/**'
      - 'tests/r24-lab-settings.test.mjs'
      - 'tests/r24-lab-integration.test.mjs'
      - 'tests/r24-lab-tactical-plan.test.mjs'
      - 'tests/r24-lab-tactical-ab.test.mjs'
      - 'tests/r24-lab-team-report.test.mjs'
      - 'tests/r24-lab-rider-roles.test.mjs'
      - 'tests/r24-lab-screenshot-audit.test.mjs'
      - 'tests/r24-lab-live-progress.test.mjs'
      - 'tests/r24-lab-v5-first-gap.test.mjs'
      - 'tests/r24-lab-v5-critical-split.test.mjs'
      - 'tests/r24-lille-main-audit-v5-comparison.mjs'
      - 'tests/r24-lab-v5-captain-diagnosis.test.mjs'
      - 'scripts/r24-lab-mobile-smoke.mjs'
      - 'scripts/r24-lab-offline-assets.mjs'
      - 'scripts/r24-gap-constants-sweep.mjs'
      - '.github/workflows/r24-browser-labor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick-gap-sweep:
    name: Drei kleine Gruppenabstands-Proben
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: In wegwerfbaren Quellkopien drei Varianten mit demselben Seed rechnen
        run: node scripts/r24-gap-constants-sweep.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixierten Main-Stand auschecken, ohne Branch zu aendern
        uses: actions/checkout@v4
        with:
          repository: Lancester/radsportmanager
          ref: 621e712371563278c5bed2bb643dd598a9a7bcf4
          path: _comparisons/main
          persist-credentials: false
      - name: Fixierten Audit-Stand auschecken, ohne Branch zu aendern
        uses: actions/checkout@v4
        with:
          repository: Lancester/radsportmanager
          ref: 1945e2d6b71289f90cca5dc8c793090a4af93341
          path: _comparisons/audit
          persist-credentials: false
      - name: Reine Konfigurations- und Ergebniszeit-Tests
        run: |
          node --experimental-strip-types --test tests/r24-lab-settings.test.mjs tests/r24-finish-time-groups.test.mjs tests/r24-lab-integration.test.mjs tests/r24-lab-tactical-plan.test.mjs tests/r24-lab-tactical-ab.test.mjs tests/r24-lab-team-report.test.mjs tests/r24-lab-rider-roles.test.mjs tests/r24-lab-screenshot-audit.test.mjs tests/r24-lab-live-progress.test.mjs tests/r24-lab-v5-captain-diagnosis.test.mjs tests/r24-lab-v5-first-gap.test.mjs tests/r24-lab-v5-critical-split.test.mjs
      - name: Main, Audit und V5 auf identischem 154-Fahrer-Lille-Input
        run: node --experimental-strip-types tests/r24-lille-main-audit-v5-comparison.mjs
      - name: Browser-JS (alle abhängigen originalen Engine-Module)
        run: |
          npx --yes --package typescript@5.9.3 tsc \
            --target ES2022 --module ES2022 --moduleResolution Bundler \
            --rewriteRelativeImportExtensions true --skipLibCheck \
            --rootDir src --outDir docs/labor/generated \
            src/labor/lab-settings.ts \
            src/engine/race/race-simulator.ts \
            src/engine/race/finish-time-groups.ts \
            src/labor/team-report.ts
      - name: Syntax und Browserpaket überprüfen
        run: |
          node --check docs/labor/app.js
          node --check docs/labor/worker.js
          node --check docs/labor/service-worker.js
          test -s docs/labor/generated/labor/lab-settings.js
          test -s docs/labor/generated/engine/race/race-simulator.js
          test -s docs/labor/generated/engine/race/finish-time-groups.js
          test -s docs/labor/generated/engine/race/reference-fixtures.js
          node --input-type=module -e "import('./docs/labor/generated/labor/lab-settings.js').then(m => {const x=m.buildLabRace(m.initialLabSettings());if(x.input.riders.length!==154)process.exit(1);console.log('Browser ESM geladen:',x.input.riders.length)})"
      - name: Lokale Offline-Dateien inklusive aller Engine-Module erfassen
        run: node scripts/r24-lab-offline-assets.mjs
      - name: Auslieferbares Paket mit eindeutiger ZIP-Struktur erstellen
        run: |
          cd docs/labor
          zip -qr ../../rennlabor-android-rc1.zip index.html app.js worker.js service-worker.js manifest.webmanifest icon.svg offline-assets.json generated README.md
          cd ../..
          unzip -t rennlabor-android-rc1.zip | tail -2
      - name: HTML/Worker im mobilen Chromium wirklich starten
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/r24-lab-mobile-smoke.mjs
      - name: Sichtprüfung im Mobilformat sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rennlabor-android-screenshot
          path: rennlabor-mobile-smoke.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Fertiges Upload-ZIP exportieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rennlabor-android-upload-zip
          path: rennlabor-android-rc1.zip
          retention-days: 14
          if-no-files-found: ignore
      - name: Browserpaket exportieren
        uses: actions/upload-artifact@v4
        with:
          name: rennlabor-browser-rc1
          path: docs/labor/
          retention-days: 14
