name: R-22ABC – einmalige 4×154-Referenzabnahme
on:
  push:
    branches: [feature/r22abc-reference-profiles-quickstart]
permissions:
  contents: read
jobs:
  validate-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vollständige Referenzrennen flach/hügelig/Klassiker/Berg
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/r22-reference-validation.mjs | tee reference-results.txt
          test "$(grep -c '^R22ABC-RACE ' reference-results.txt)" -eq 4
          grep -q '^R22ABC-OVERALL ' reference-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r22abc-four-reference-races
          path: reference-results.txt
          retention-days: 14
