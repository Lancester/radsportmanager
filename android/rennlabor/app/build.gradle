plugins {
    id 'com.android.application'
}
android {
    namespace 'de.radsportmanager.rennlabor'
    compileSdk 35
    defaultConfig {
        applicationId 'de.radsportmanager.rennlabor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-rc1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
